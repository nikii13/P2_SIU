<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control móvil</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="app-shell mobile-shell">
  <header class="page-header hero-header mobile-header">
    <div>
      <p class="eyebrow">Mobile Control</p>
      <h1>Reserva tu máquina</h1>
      <p class="header-subtitle">Selecciona una máquina, revisa su estado y confirma la reserva.</p>
    </div>
    <div class="header-login" id="header-login">
      <input id="username-input" placeholder="Tu nombre">
      <button id="login-btn">Entrar</button>
    </div>

    <div class="header-user hidden" id="header-user">
      <span id="username-display"></span>
      <button id="logout-btn" class="logout-btn">Cerrar sesión</button>
    </div>
  </header>

  <main class="page-content">
    <section class="filter-section filter-card">
      <div class="filter-group">
        <label for="filter">Filtrar por categoría</label>
        <select id="filter">
          <option value="all">Todas</option>
          <option value="Cardio">Cardio</option>
          <option value="Tren superior">Tren superior</option>
          <option value="Core">Core</option>
          <option value="Tren inferior">Tren inferior</option>
        </select>
      </div>
    </section>

    <section class="filter-section filter-card gesture-embed">
      <div class="gesture-embedded" id="gesture-screen">
        <div class="gesture-overlay">
          <p class="gesture-label">Control por gestos</p>
          <h2 class="gesture-title">Navega con la mano</h2>
          <p class="gesture-instructions">
            Mueve la mano hacia arriba o abajo frente a la cámara para hacer scroll en la pantalla del gimnasio.
          </p>
          <div class="gesture-actions">
            <button id="gesture-start-btn" class="gesture-start-btn" type="button">Activar cámara</button>
          </div>
        </div>

        <div class="gesture-camera-wrap">
          <video id="camera-feed" autoplay playsinline></video>
          <canvas id="hand-canvas"></canvas>
        </div>

        <div class="gesture-status" id="gesture-status">
          <span class="status-dot" id="status-dot"></span>
          <span id="status-text">Cámara desactivada</span>
        </div>
        <pre id="gesture-debug" class="gesture-debug hidden"></pre>

        <div class="gesture-arrow" id="gesture-arrow"></div>
      </div>
    </section>

    <section>
      <div id="feedback-message" class="feedback-message hidden"></div>
      <div id="mobile-machines-container" class="machines-list"></div>
    </section>
  </main>

  <div id="voice-chat" class="voice-chat hidden">
    <div id="voice-log" class="voice-log"></div>
  </div>

  <button id="voice-btn" class="voice-btn" title="Activar control por voz">🎙</button>

  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1675466862/camera_utils.min.js" crossorigin="anonymous"></script>
  <script src="/mobile.js"></script>
  <script src="/gesture.js"></script>
</body>
</html>
